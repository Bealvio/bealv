apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-postgres
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 1
  # Single instance on a 2-node cluster: a PDB only blocks node drains
  # (downtime during rollouts is accepted).
  enablePDB: false
  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud
      secret:
        name: nextcloud-secrets
  storage:
    size: 16Gi
