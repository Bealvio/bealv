apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: alertmanager-mgmt
  namespace: monitoring
spec:
  allowCrossNamespaceImport: false
  datasource:
    access: proxy
    isDefault: false
    jsonData:
      implementation: prometheus
      timeInterval: 30s
      tlsSkipVerify: true
    name: alertmanager-mgmt
    type: alertmanager
    url: https://alertmanager.bealv-mgmt.lan
  instanceSelector:
    matchLabels:
      alertmanager-default: "true"
  resyncPeriod: 10m
---
# Mimir on mgmt (Bealvio/flux-mgmt gitops/apps/mimir): bealv + mgmt metrics,
# 15 days. Default datasource: dashboards open on it and the `cluster`
# variable picks the cluster. The local Prometheus stays in the dropdown.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: mimir
  namespace: monitoring
spec:
  allowCrossNamespaceImport: false
  datasource:
    access: proxy
    isDefault: true
    jsonData:
      prometheusType: Mimir
      timeInterval: 30s
      tlsSkipVerify: true
    name: mimir
    uid: mimir
    type: prometheus
    url: https://mimir.bealv-mgmt.lan/prometheus
  instanceSelector:
    matchLabels:
      dashboards: grafana
  resyncPeriod: 10m
