apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: immich-dragonfly
spec:
  replicas: 1
  # Conso mesuree < 10m : la reservation a 500m bloquait l'ordonnancement
  # sans rien refleter. La limite reste a 600m pour absorber les pics.
  resources:
    requests:
      cpu: 100m
      memory: 500Mi
    limits:
      cpu: 600m
      memory: 750Mi
  args:
    - --default_lua_flags=allow-undeclared-keys,disable-atomicity
