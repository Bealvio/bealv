apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  chart:
    spec:
      chart: immich
      version: 0.13.1
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: immich
      interval: 12h
  values:
    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            env:
              DB_VECTOR_EXTENSION: vectorchord
              REDIS_HOSTNAME: "immich-dragonfly"
              DB_HOSTNAME: "immich-postgres-rw"
              DB_USERNAME: "immich"
              DB_DATABASE_NAME: "immich"
              IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: immich-secrets
            image:
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
              tag: v3.2.2
    immich:
      metrics:
        enabled: false
      persistence:
        library:
          existingClaim: immich-data
    # Immich components
    server:
      enabled: true
      controllers:
        main:
          strategy: Recreate
          # Needs the iGPU: may preempt ordinary pods on the GPU worker.
          pod:
            priorityClassName: gpu-workload
          # No serviceAccount override: use the chart's auto-created "immich-server" SA.
          # (Pinning name: immich referenced a non-existent SA and blocked pod creation.)
          containers:
            main:
              resources:
                # Idle most of the time; it must fit on the single node that
                # has the GPU. Limits still allow bursts for transcoding/import.
                requests:
                  cpu: 100m
                  memory: 2Gi
                limits:
                  gpu.intel.com/i915: 1
                  cpu: 2
                  memory: 4Gi
      automountServiceAccountToken: true
      ingress:
        main:
          enabled: false
    machine-learning:
      enabled: true
      persistence:
        cache:
          enabled: true
          # Optional: switch type to persistentVolumeClaim (and add size/accessMode/storageClass
          # under it) to avoid re-downloading the ML models on every start.
          type: emptyDir
      controllers:
        main:
          containers:
            main:
              resources:
                # Measured ~1m idle; jobs burst up to the limit.
                requests:
                  cpu: 50m
                  memory: 2Gi
                limits:
                  cpu: 6
                  memory: 2Gi
              env:
                TRANSFORMERS_CACHE: /cache
