apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  chart:
    spec:
      chart: immich
      version: sha256-b8e890d0d9804759c6b6f3e5f9a850512ca09b9ccc6d137a2f85cbf761981bd1
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: immich
      interval: 12h
  values:
    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            env:
              DB_VECTOR_EXTENSION: vectorchord
              REDIS_HOSTNAME: 'immich-dragonfly'
              DB_HOSTNAME: 'immich-postgres-rw'
              DB_USERNAME: 'immich'
              DB_DATABASE_NAME: 'immich'
              IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: immich-secrets
            image:
              tag: v3.0.3
    immich:
      metrics:
        enabled: false
      persistence:
        library:
          existingClaim: immich-data
    # Immich components
    server:
      enabled: true
      controllers:
        main:
          strategy: Recreate
          # No serviceAccount override: use the chart's auto-created "immich-server" SA.
          # (Pinning name: immich referenced a non-existent SA and blocked pod creation.)
          containers:
            main:
              resources:
                requests:
                  cpu: 200m
                  memory: 2Gi
                limits:
                  gpu.intel.com/i915: 1
                  cpu: 2
                  memory: 4Gi
      automountServiceAccountToken: true
      ingress:
        main:
          enabled: false
    machine-learning:
      enabled: true
      persistence:
        cache:
          enabled: true
          # Optional: switch type to persistentVolumeClaim (and add size/accessMode/storageClass
          # under it) to avoid re-downloading the ML models on every start.
          type: emptyDir
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 200m
                  memory: 2Gi
                limits:
                  cpu: 6
                  memory: 2Gi
              env:
                TRANSFORMERS_CACHE: /cache
