apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dollardollar-postgres
spec:
  instances: 1
  # Single instance on a 2-node cluster: a PDB only blocks node drains
  # (downtime during rollouts is accepted).
  enablePDB: false
  bootstrap:
    initdb:
      database: dollardollar
      owner: dollardollar
      secret:
        name: dollardollar-secrets
  storage:
    size: 4Gi
---
