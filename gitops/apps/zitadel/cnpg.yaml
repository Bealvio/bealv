apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-postgres
spec:
  instances: 1
  # Single instance on a 2-node cluster: a PDB only blocks node drains
  # (downtime during rollouts is accepted).
  enablePDB: false
  enableSuperuserAccess: true
  superuserSecret:
    name: zitadel-secrets
  storage:
    size: 70Gi
  bootstrap:
    initdb:
      database: zitadel
      owner: zitadel
      secret:
        name: zitadel-secrets
