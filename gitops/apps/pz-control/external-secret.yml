apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pz-control-secrets
  namespace: project-zomboid
spec:
  refreshInterval: '1h'
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: pz-control-secrets
  data:
    - secretKey: password
      remoteRef:
        key: secrets-bealv/pz-control/auth
        property: password
    - secretKey: signing-key
      remoteRef:
        key: secrets-bealv/pz-control/auth
        property: signing-key
