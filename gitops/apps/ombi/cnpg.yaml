apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ombi-postgres
spec:
  instances: 1
  # Single instance on a 2-node cluster: a PDB only blocks node drains
  # (downtime during rollouts is accepted).
  enablePDB: false
  storage:
    storageClass: disk-hddb
    size: 50Gi
  walStorage:
    size: 10Gi
    storageClass: disk
  bootstrap:
    initdb:
      database: ombi
      owner: ombi
      secret:
        name: ombi-secrets
