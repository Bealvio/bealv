name: Renovate
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info
  schedule:
    - cron: "47 */4 * * *" # every 4 hours
  push:
    branches: [main]
    paths:
      - renovate.json5
      - .github/workflows/renovate.yaml
concurrency:
  group: renovate
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: 44.116.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.UPCLI_APP_ID }}
          private-key: ${{ secrets.UPCLI_SECRET_ID }}
      # Post-upgrade tasks (scripts/renovate-post-upgrade.sh) need nix.
      - name: Get nixpkgs revision
        run: echo "url=$(jq -r .pins.nixpkgs.url npins/sources.json)" >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=${{ env.url }}
          extra_nix_config: |
            fallback = true
            trusted-public-keys = didactiklabs-nixcache:PxLKN0+ZkP07M8g8/B6xbP6A4MYpqQg6LH7V3muiy/0= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            substituters = https://s3.didactiklabs.io/nix-cache https://cache.nixos.org/
      # `go mod tidy` for gitops/apps/pz-control/app
      - uses: actions/setup-go@v5
        with:
          go-version-file: gitops/apps/pz-control/app/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run Renovate
        run: npx --yes "renovate@${RENOVATE_VERSION}"
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_GIT_AUTHOR: "update-chan <bots@bealv.io>"
          RENOVATE_BINARY_SOURCE: global
          RENOVATE_ALLOWED_COMMANDS: '["^nix-shell --run ''\\./scripts/renovate-post-upgrade\\.sh [a-z0-9-]+ \\S+''$"]'
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
